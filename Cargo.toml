[package]
name = "musicforge-plugins"
version = "0.7.0"
edition = "2021"
license = "Apache-2.0"
description = "First-party MusicForge plugins (AI + online providers) — separate distribution, disabled by default"
repository = "https://github.com/simenty/musicforge-plugins"

# 铁律（PLUGIN_POLICY.md）：插件永不获得删除/移动/覆盖文件的权限——
# 本仓全部插件只返回 Suggestion；写入必经 core 的 用户确认 → Plan → Apply。
# 默认禁用：装载需用户在 GUI「AI 与插件」面板或 config.json 显式启用。

[lib]
name = "musicforge_plugins"
path = "src/lib.rs"

[[bin]]
name = "ai-openai-compatible"
path = "src/bin/ai_openai_compatible.rs"

[[bin]]
name = "lyrics-online"
path = "src/bin/lyrics_online.rs"

[[bin]]
name = "cover-online"
path = "src/bin/cover_online.rs"

[dependencies]
# 协议正典（X8/D20）：与主仓共享的纯协议 crate（零进程、零网络）。
# 本地开发走 path 依赖；发布时改为 git 依赖并锁定 MusicForge v0.7.0 tag。
musicforge-plugin-api = { path = "../MusicForge/musicforge-plugin-api" }
serde_json = "1"
# 阻塞 HTTP（rustls，无 openssl 依赖；插件进程内发起请求——core/CLI/GUI 永远零网络）
ureq = { version = "2", features = ["json"] }

[profile.release]
lto = true
opt-level = "z"
strip = true
